
name: Verify CollegePath

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collegepath
          POSTGRES_PASSWORD: collegepath_ci_password
          POSTGRES_DB: collegepath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collegepath -d collegepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://collegepath:collegepath_ci_password@localhost:5432/collegepath?schema=public
      BETTER_AUTH_SECRET: collegepath-ci-only-secret-not-used-outside-ci
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:deploy

      - name: Seed database
        run: npm run db:seed

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
